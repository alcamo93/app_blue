name: Backfill Blue 20920

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Fecha inicial (YYYY-MM-DD)'
        required: true
        default: '2026-07-28'
        type: string
      to_date:
        description: 'Fecha final (YYYY-MM-DD)'
        required: true
        default: '2026-08-12'
        type: string

jobs:
  backfill-20920:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BM_USERNAME: ${{ secrets.BM_USERNAME }}
      BM_PASSWORD: ${{ secrets.BM_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PORT: ${{ secrets.DB_PORT }}
      TIMEZONE: ${{ secrets.TIMEZONE }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Validar rango solicitado
        shell: bash
        run: |
          FROM_DATE="${{ inputs.from_date }}"
          TO_DATE="${{ inputs.to_date }}"
          YESTERDAY_MX="$(TZ=America/Mexico_City date -d 'yesterday' +%F)"

          if ! [[ "$FROM_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Fecha inicial inválida: $FROM_DATE"
            exit 1
          fi

          if ! [[ "$TO_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Fecha final inválida: $TO_DATE"
            exit 1
          fi

          if [[ "$FROM_DATE" < "2026-07-28" ]]; then
            echo "El template 20920 se recuperará únicamente desde 2026-07-28."
            exit 1
          fi

          if [[ "$TO_DATE" < "$FROM_DATE" ]]; then
            echo "La fecha final no puede ser anterior a la inicial."
            exit 1
          fi

          if [[ "$TO_DATE" > "$YESTERDAY_MX" ]]; then
            echo "Solo se permiten días cerrados."
            echo "Último día permitido: $YESTERDAY_MX"
            exit 1
          fi

          echo "Rango validado: $FROM_DATE -> $TO_DATE"

      - name: Ejecutar backfill Blue 20920
        run: |
          node src/jobs/manualFetch.js \
            20920 \
            "${{ inputs.from_date }}" \
            "${{ inputs.to_date }}"
